name: Build firmware

# Compiles the sketch with the pinned ESP32 core (2.0.17) for the ESP32-S3, runs the host tests of the timer engine,
# and keeps the .bin files as a downloadable artifact. Push a tag like v0.3.0 to also publish them as a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host tests (engine and settings parser)
        run: make test

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.17
        run: make deps

      - name: Rebuild the embedded web page and icons
        run: |
          python3 tools/embed_ui.py
          python3 tools/embed_icons.py

      - name: Compile (esp32:esp32:esp32s3, USB CDC on boot)
        run: make build

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/beacon-timer.ino.bin dist/beacon-timer.ota.bin
          cp build/beacon-timer.ino.merged.bin dist/beacon-timer.full.bin
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: beacon-timer-firmware
          path: dist/*.bin

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
